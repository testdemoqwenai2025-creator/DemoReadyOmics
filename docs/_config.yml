# GitHub Pages config for DemoReadyOmics
# Serves the public-facing Tessera Bio / ReadyOmics landing page + docs

title: Tessera Bio / ReadyOmics
description: >-
  ML-ready, harmonised, version-controlled biological datasets for
  drug discovery and computational biology teams.
url: https://testdemoqwenai2025-creator.github.io
baseurl: /DemoReadyOmics

# Use the jekyll-theme-primer (GitHub Pages default) but override with
# our own _layouts/default.html for the landing page
theme: jekyll-theme-primer

# Disable default layouts so our custom _layouts/default.html takes over
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Markdown rendering for the docs/ subpages
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# SEO
plugins:
  - jekyll-seo-tag

# Exclude build artefacts
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Page-specific front matter defaults
permalink: pretty
